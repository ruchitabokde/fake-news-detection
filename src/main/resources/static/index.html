<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fake News</title>
    <style>
        body { font: 16px/1.5 system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
        textarea { box-sizing: border-box; width: 100%; min-height: 180px; padding: 12px; font: inherit; }
        button { margin-top: 12px; padding: 10px 16px; cursor: pointer; }
        #result { margin-top: 1.5rem; padding: 1rem; background: #f2f5f9; border-radius: 8px; }
        .term { display: inline-block; margin: 4px; padding: 2px 8px; background: #dbeafe; border-radius: 12px; }
        .error { color: #b42318; }
    </style>
</head>
<body>
<h1>Fake News</h1>
<p>Enter a headline or article to classify it with the saved machine-learning model.</p>
<form id="form">
    <label for="text">Headline or article</label>
    <textarea id="text" required placeholder="Paste news text here..."></textarea>
    <button type="submit">Analyze</button>
</form>
<section id="result" aria-live="polite" hidden></section>
<script>
    const form = document.querySelector("#form");
    const result = document.querySelector("#result");
    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.hidden = false;
        result.textContent = "Analyzing...";
        result.className = "";
        try {
            const response = await fetch("/api/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: document.querySelector("#text").value })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || data.message || "Prediction failed.");
            const heading = document.createElement("h2");
            heading.textContent = `Prediction: ${data.predictedClass.toUpperCase()}`;
            const confidence = document.createElement("p");
            confidence.textContent = `Confidence: ${(data.confidence * 100).toFixed(1)}% | Probability fake: ${(data.probabilityFake * 100).toFixed(1)}%`;
            const label = document.createElement("p");
            label.textContent = "Prominent TF-IDF terms:";
            result.replaceChildren(heading, confidence, label);
            for (const term of data.influentialTerms) {
                const chip = document.createElement("span");
                chip.className = "term";
                chip.textContent = `${term.term} (${term.tfidfWeight.toFixed(3)})`;
                result.append(chip);
            }
        } catch (error) {
            result.className = "error";
            result.textContent = error.message;
        }
    });
</script>
</body>
</html>
